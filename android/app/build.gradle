plugins {
    id 'com.android.application'
}

// Release signing comes from the environment (see android/README.md); without it the release
// APK is signed with the local debug key.
def keystore = System.getenv('ANDROID_KEYSTORE')

android {
    namespace 'org.shadowice.andotp'
    compileSdk 35

    defaultConfig {
        // Different from the legacy app (org.shadowice.flocke.andotp) so both can be installed.
        applicationId 'org.shadowice.andotp'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    signingConfigs {
        release {
            if (keystore) {
                storeFile file(keystore)
                storePassword System.getenv('ANDROID_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystore ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
