[package]
name = "andotp-core"
description = "Core library of andOTP: TOTP/HOTP/Steam/mOTP tokens, otpauth URIs and andOTP-compatible encrypted backups"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
aes-gcm = "0.10"
directories = "6"
hmac = "0.12"
md-5 = "0.10"
percent-encoding = "2"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
url = "2"
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
